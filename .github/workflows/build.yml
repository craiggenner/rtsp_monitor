name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build linux/amd64
        run: GOOS=linux GOARCH=amd64 go build -o rtsp-monitor-linux-amd64 .

      - name: Build linux/arm64
        run: GOOS=linux GOARCH=arm64 go build -o rtsp-monitor-linux-arm64 .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtsp-monitor-binaries
          path: |
            rtsp-monitor-linux-amd64
            rtsp-monitor-linux-arm64
          retention-days: 90
